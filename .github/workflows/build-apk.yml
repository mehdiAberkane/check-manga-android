name: Compilation APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Avec les secrets de signature : APK release signé avec ta clé (installable
      # par-dessus les versions précédentes). Sinon : APK debug.
      - name: Préparer la signature release
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<PROPS
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Tests unitaires
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compiler
        run: |
          if [ -f keystore.properties ]; then
            ./gradlew --no-daemon assembleRelease
            apk=app/build/outputs/apk/release/app-release.apk
          else
            ./gradlew --no-daemon assembleDebug
            apk=app/build/outputs/apk/debug/app-debug.apk
          fi
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          cp "$apk" manga-reminder.apk
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # Lu par l'app pour proposer la mise à jour (même calcul que versionCode dans app/build.gradle.kts).
          # Seuls les APK signés avec la clé du projet peuvent s'installer par-dessus l'app.
          signed=false; [ -f keystore.properties ] && signed=true
          printf '{"versionCode":%d,"versionName":"%s","signed":%s,"commit":"%s"}\n' \
            "$((1000 + GITHUB_RUN_NUMBER))" "$version" "$signed" "$GITHUB_SHA" > version.json
          cat version.json

      - name: Nettoyer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: manga-reminder-${{ env.VERSION }}
          path: |
            manga-reminder.apk
            version.json

      # Chaque push sur main remplace la release « latest » : lien de téléchargement fixe
      # https://github.com/<owner>/<repo>/releases/download/latest/manga-reminder.apk
      - name: Publier la dernière version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest manga-reminder.apk version.json \
            --target "$GITHUB_SHA" \
            --title "Dernière version ($VERSION, ${GITHUB_SHA::7})" \
            --notes "APK compilé automatiquement depuis le commit $GITHUB_SHA."

      - name: Publier la version taguée
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp manga-reminder.apk "manga-reminder-$VERSION.apk"
          gh release create "$GITHUB_REF_NAME" "manga-reminder-$VERSION.apk" \
            --title "Manga Reminder $GITHUB_REF_NAME" --generate-notes
