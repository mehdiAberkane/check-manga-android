name: Compilation APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      # Empreinte publique du certificat release (CN=Mehdi, O=Manga Reminder).
      RELEASE_CERT_SHA256: df049f29f919327d1bf1c863d8782d3125a2e546745369e198bea2f08d110d5c

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Avec les secrets de signature : APK release signé avec ta clé (installable
      # par-dessus les versions précédentes). Sinon : APK debug, seulement pour les
      # pull requests et les lancements manuels, qui ne publient rien.
      - name: Exiger la clé de publication
        if: github.event_name == 'push' && env.KEYSTORE_BASE64 == ''
        run: |
          echo "::error::Secrets de signature absents : un APK debug ne doit pas être publié (voir README, Signature)."
          exit 1

      - name: Préparer la signature release
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<PROPS
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Tests unitaires
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compiler
        run: |
          if [ -f keystore.properties ]; then
            ./gradlew --no-daemon assembleRelease
            apk=app/build/outputs/apk/release/app-release.apk
            # Une mauvaise clé dans les secrets donnerait un APK impossible à installer
            # par-dessus la version du téléphone : on refuse de le publier.
            apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
            cert=$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            if [ "$cert" != "$RELEASE_CERT_SHA256" ]; then
              echo "::error::APK signé avec un certificat inattendu ($cert)."
              exit 1
            fi
          else
            ./gradlew --no-daemon assembleDebug
            apk=app/build/outputs/apk/debug/app-debug.apk
          fi
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          cp "$apk" manga-reminder.apk
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Nettoyer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: manga-reminder-${{ env.VERSION }}
          path: manga-reminder.apk

      # Chaque push sur main remplace la release « latest » : lien de téléchargement fixe
      # https://github.com/<owner>/<repo>/releases/download/latest/manga-reminder.apk
      - name: Publier la dernière version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest manga-reminder.apk \
            --target "$GITHUB_SHA" \
            --title "Dernière version ($VERSION, ${GITHUB_SHA::7})" \
            --notes "APK compilé automatiquement depuis le commit $GITHUB_SHA."

      - name: Publier la version taguée
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp manga-reminder.apk "manga-reminder-$VERSION.apk"
          gh release create "$GITHUB_REF_NAME" "manga-reminder-$VERSION.apk" \
            --title "Manga Reminder $GITHUB_REF_NAME" --generate-notes
