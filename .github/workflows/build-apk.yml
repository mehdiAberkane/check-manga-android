name: Compilation APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Lecture seule par défaut : seul le job « release » peut écrire (releases).
permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

# Actions épinglées sur un commit (le tag est en commentaire) : un tag déplacé ne change pas
# le code exécuté. Dependabot propose les mises à jour (.github/dependabot.yml).
jobs:
  # Tests et APK debug, sans aucun secret ni droit d'écriture : c'est le seul job des pull requests
  # (check « build » exigé par la protection de main).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Tests unitaires et APK debug
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      # APK debug (clé jetable, non installable par-dessus la version du téléphone) : pour essayer
      # une pull request sur un autre appareil.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'push'
        with:
          name: manga-reminder-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  # APK release signé et publication : seulement après un push sur main ou un tag v*, une fois
  # les tests passés. La clé n'existe que dans ce job, le temps de la compilation.
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Environnement protégé : ses secrets ne sont accessibles qu'à main et aux tags v*.
    environment: release
    permissions:
      contents: write
    env:
      # Empreinte publique du certificat release (CN=Mehdi, O=Manga Reminder).
      RELEASE_CERT_SHA256: df049f29f919327d1bf1c863d8782d3125a2e546745369e198bea2f08d110d5c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Une version publiée doit pouvoir être reconnue par l'app : tag = v<versionName>
      # et versionCode strictement supérieur à celui de la version stable précédente.
      - name: Contrôler la version du tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts)
          if [ "$GITHUB_REF_NAME" != "v$name" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à versionName ($name) : attendu v$name."
            exit 1
          fi
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -n "$previous" ] && gh release download "$previous" --repo "$GITHUB_REPOSITORY" --pattern version.json --output "$RUNNER_TEMP/previous.json" 2>/dev/null; then
            previous_code=$(jq -r .versionCode "$RUNNER_TEMP/previous.json")
            if [ "$code" -le "$previous_code" ]; then
              echo "::error::versionCode $code doit être supérieur à celui de $previous ($previous_code)."
              exit 1
            fi
          else
            echo "Pas de version stable précédente avec version.json : contrôle du versionCode ignoré."
          fi

      # Les secrets ne sont exposés qu'à cette étape. Sans eux, on échoue : un APK debug
      # ne doit jamais être publié.
      - name: Préparer la signature release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secrets de signature absents (voir README, Signature)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<PROPS
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Compiler l'APK release
        run: ./gradlew --no-daemon assembleRelease

      - name: Nettoyer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties

      - name: Vérifier la signature et décrire l'APK
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          # Une mauvaise clé dans les secrets donnerait un APK impossible à installer
          # par-dessus la version du téléphone : on refuse de le publier.
          # Le libellé du signataire varie selon la version de build-tools
          # (« Signer #1 », « Signer (minSdkVersion=…) ») : on ne garde que l'empreinte,
          # et il doit n'y en avoir qu'une.
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          certs=$("$apksigner" verify --print-certs "$apk")
          cert=$(echo "$certs" | sed -n 's/.*certificate SHA-256 digest: //p' | sort -u)
          if [ "$cert" != "$RELEASE_CERT_SHA256" ]; then
            echo "$certs"
            echo "::error::APK signé avec un certificat inattendu : ${cert:-aucune empreinte lue}."
            exit 1
          fi
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          version_code=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts)
          case "$GITHUB_REF" in
            refs/tags/v*) apk_name="manga-reminder-$version.apk" ;;
            *) apk_name="manga-reminder.apk" ;;
          esac
          cp "$apk" "$apk_name"
          # version.json décrit l'APK de la release : l'app le lit pour savoir s'il existe
          # une version plus récente et vérifier le fichier téléchargé.
          jq -n \
            --argjson versionCode "$version_code" \
            --arg versionName "$version" \
            --arg apk "$apk_name" \
            --arg sha256 "$(sha256sum "$apk_name" | cut -d' ' -f1)" \
            --arg commit "$GITHUB_SHA" \
            '{versionCode: $versionCode, versionName: $versionName, apk: $apk, sha256: $sha256, commit: $commit}' \
            > version.json
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "APK_NAME=$apk_name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manga-reminder-${{ env.VERSION }}
          path: |
            ${{ env.APK_NAME }}
            version.json

      # Chaque push sur main remplace la pre-release « latest » (build de développement,
      # jamais marquée comme dernière version) : lien de téléchargement fixe
      # https://github.com/<owner>/<repo>/releases/download/latest/manga-reminder.apk
      - name: Publier la version de développement
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "$APK_NAME" version.json \
            --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title "Développement ($VERSION, ${GITHUB_SHA::7})" \
            --notes "Build de développement, compilé automatiquement depuis le commit $GITHUB_SHA."

      # Les tags vX.Y sont les versions stables : la plus récente est la release « Latest »
      # que l'app interroge (GET /repos/<owner>/<repo>/releases/latest).
      - name: Publier la version taguée
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK_NAME" version.json \
            --latest \
            --title "Manga Reminder $GITHUB_REF_NAME" --generate-notes
